spring.application.name=taste-backend

# Banco de dados: em desenvolvimento local usa H2 em memoria por padrao.
# Em producao, defina DATABASE_URL com a connection string do Neon
# (postgresql://usuario:senha@host/banco?sslmode=require) -- ver
# DatabaseUrlEnvironmentPostProcessor. Tambem funcionam SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:taste;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Plano gratuito: poucas conexoes bastam e evitam estourar o limite do Neon.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT: defina TASTE_JWT_SECRET em producao (string longa e aleatoria).
taste.jwt.secret=${TASTE_JWT_SECRET:taste-dev-secret-change-me-taste-dev-secret-change-me}
taste.jwt.expiration-ms=${TASTE_JWT_EXPIRATION_MS:604800000}

# CORS: lista separada por virgula das origens do frontend autorizadas.
taste.cors.allowed-origins=${TASTE_CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
