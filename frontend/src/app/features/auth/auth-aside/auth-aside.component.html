<aside class="auth-aside">
  <app-logo [showTagline]="true" tone="light"></app-logo>

  <div class="auth-aside__body">
    <h2 class="display-title auth-aside__title">Boa comida, boas memórias.</h2>
    <p class="auth-aside__text">Veja o que seus amigos andam comendo, guarde cada prato que você provou e descubra onde ir pela indicação de quem você confia.</p>
  </div>

  <!-- Prévia ilustrativa do feed (conteúdo de exemplo) -->
  <figure class="auth-aside__board" aria-label="Exemplo ilustrativo do feed de amigos">
    <figcaption class="auth-aside__caption board-label">Exemplo ilustrativo</figcaption>
    @for (line of previewLines; track line.dish) {
      <div class="auth-aside__line">
        <span class="auth-aside__line-text">
          <span class="board-label">{{ line.friend }}</span>
          <span class="auth-aside__dish">{{ line.dish }}</span>
          <span class="auth-aside__place">{{ line.place }}</span>
        </span>
        <span class="score-tag score-tag--sm">{{ line.score }}</span>
      </div>
    }
  </figure>
</aside>
