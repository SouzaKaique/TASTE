<div class="container-narrow section-spacing">
  <header class="page-header">
    <div>
      <p class="eyebrow">Comunidade</p>
      <h1>Feed social</h1>
    </div>
    <a routerLink="/app/amigos" class="btn btn-ghost-on-bg">
      <i class="bi bi-person-plus"></i> Buscar amigos
    </a>
  </header>

  @if (loading()) {
    <app-loading-state [count]="3"></app-loading-state>
  } @else if (error()) {
    <app-error-state title="Não foi possível carregar o feed" (retry)="load()"></app-error-state>
  } @else if (!items().length) {
    <app-empty-state
      icon="bi-people"
      title="Seu feed está vazio"
      description="Adicione amigos para ver as experiências deles aqui. Suas experiências públicas também aparecem no feed."
    >
      <a routerLink="/app/amigos" class="btn btn-primary mt-3">Buscar amigos</a>
    </app-empty-state>
  } @else {
    <div class="feed-list">
      @for (item of items(); track item.id) {
        <app-feed-item
          [item]="item"
          (toggleLike)="onToggleLike($event)"
          (addComment)="onAddComment($event)"
          (removeComment)="onRemoveComment($event)"
        ></app-feed-item>
      }
    </div>
  }
</div>
