@if (readonlyMode()) {
  <!-- Só exibição: uma imagem com a nota, sem botões (o leitor de tela lê "Nota 4 de 5") -->
  <span class="star-rating" [class]="'star-rating--' + size()" role="img" [attr.aria-label]="'Nota ' + value() + ' de ' + max">
    @for (star of stars; track star) {
      <span class="star-rating__star" [class.is-filled]="isFilled(star)" aria-hidden="true">
        <i class="bi" [class.bi-star-fill]="isFilled(star)" [class.bi-star]="!isFilled(star)"></i>
      </span>
    }
  </span>
} @else {
  <div
    class="star-rating"
    [class]="'star-rating--' + size()"
    role="radiogroup"
    [attr.aria-label]="label()"
    tabindex="0"
    (keydown)="onKeydown($event)"
  >
    @for (star of stars; track star) {
      <button
        type="button"
        class="star-rating__star"
        role="radio"
        [attr.aria-checked]="value() === star"
        [attr.aria-label]="star + ' de ' + max + ' estrelas'"
        [disabled]="disabled()"
        [class.is-filled]="isFilled(star)"
        (click)="select(star)"
        (mouseenter)="hovered.set(star)"
        (mouseleave)="hovered.set(null)"
      >
        <i class="bi" [class.bi-star-fill]="isFilled(star)" [class.bi-star]="!isFilled(star)" aria-hidden="true"></i>
      </button>
    }
    <span class="star-rating__value visually-hidden" aria-live="polite">{{ value() }} de {{ max }}</span>
  </div>
}
