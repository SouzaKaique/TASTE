# Blueprint do Render: cria o servico do backend do TASTE.
# Painel do Render > New > Blueprint > escolha este repositorio.
services:
  - type: web
    name: taste-backend
    runtime: docker
    plan: free
    region: virginia
    # Monorepo: so mudancas dentro de backend/ disparam um novo deploy.
    rootDir: backend
    # Com rootDir definido, o Render resolve os caminhos do Docker a partir de backend/.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # Connection string do Neon (postgresql://...). Preenchida por voce no painel.
      - key: DATABASE_URL
        sync: false
      # Endereco do site na Vercel, ex: https://taste.vercel.app (sem barra no final).
      - key: TASTE_CORS_ALLOWED_ORIGINS
        sync: false
      # Login com Google e Apple (opcional): sem o ID, o botao daquele provedor nao aparece.
      - key: TASTE_GOOGLE_CLIENT_ID
        sync: false
      - key: TASTE_APPLE_CLIENT_ID
        sync: false
      # Endereco publico deste backend, ex: https://taste-backend.onrender.com (sem barra no final).
      - key: TASTE_PUBLIC_API_URL
        sync: false
      # Segredo dos tokens de login: o Render gera um valor aleatorio e seguro.
      - key: TASTE_JWT_SECRET
        generateValue: true
