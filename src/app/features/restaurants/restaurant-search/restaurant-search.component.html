<div class="container-editorial section-spacing">
  <header class="page-header">
    <p class="eyebrow">Descoberta</p>
    <h1>Buscar restaurantes</h1>
  </header>

  <div class="search-bar surface-card">
    <i class="bi bi-search"></i>
    <input
      type="text"
      class="form-control"
      placeholder="Buscar por nome, cidade ou país..."
      [ngModel]="term()"
      (ngModelChange)="term.set($event)"
    />
    <select class="form-select" [ngModel]="city()" (ngModelChange)="city.set($event)">
      <option value="">Todas as cidades</option>
      @for (c of cities(); track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>

  @if (loading()) {
    <app-loading-state [count]="8"></app-loading-state>
  } @else if (!filtered().length) {
    <app-empty-state
      icon="bi-shop"
      title="Nenhum restaurante encontrado"
      description="Tente outro termo de busca ou cadastre este local ao registrar uma experiência."
    ></app-empty-state>
  } @else {
    <div class="restaurant-grid">
      @for (r of filtered(); track r.id) {
        <app-restaurant-card [restaurant]="r"></app-restaurant-card>
      }
    </div>
  }
</div>
